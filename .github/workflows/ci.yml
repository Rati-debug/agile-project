name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test_build_scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django flake8 bandit pip-audit

      - name: Lint (flake8)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Security (Bandit)
        run: bandit -r . || true

      - name: Dependency Audit (pip-audit)
        run: pip-audit -r requirements.txt || true

      - name: Run tests (pytest)
        env:
          DJANGO_SETTINGS_MODULE: CollegeERP.settings
        run: pytest -q

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/college-erp:${{ github.sha }}

  # Example job to push container image (enable when ready)
  push_image:
    needs: test_build_scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/college-erp:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/college-erp:latest

  # (Optional) Deploy to Staging with kubectl/helm after image push
  deploy_staging:
    needs: push_image
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Configure AWS credentials via OIDC (no long-lived secrets).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ap-south-1

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV
          echo "IMAGE_REPO=ghcr.io/${{ github.repository_owner }}/college-erp" >> $GITHUB_ENV

      - name: Helm upgrade
        run: |
          helm upgrade --install college-erp ./helm \
            --namespace erp --create-namespace \
            --set image.repository=${IMAGE_REPO} \
            --set image.tag=${IMAGE_TAG} \
            --set env.DJANGO_ALLOWED_HOSTS=${{ secrets.STAGING_HOSTNAME }} \
            --set secrets.DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            --set ingress.hosts[0]=${{ secrets.STAGING_HOSTNAME }}
